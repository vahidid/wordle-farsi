plugins {
    id 'com.android.application'
}

def twaHost = project.hasProperty('twaHost') ? project.property('twaHost') : 'wordle-farsi.vercel.app'
def twaDefaultUrl = "https://${twaHost}"

android {
    namespace 'ir.wordlefarsi.twa'
    compileSdk 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "ir.wordlefarsi.twa"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        manifestPlaceholders = [
            hostName: twaHost,
            defaultUrl: twaDefaultUrl,
            launcherName: "@string/app_name",
            assetStatements: "[{\"relation\": [\"delegate_permission/common.handle_all_urls\"], \"target\": {\"namespace\": \"web\", \"site\": \"https://${twaHost}\"}}]"
        ]
    }

    signingConfigs {
        release {
            def keyPropsFile = rootProject.file("key.properties")
            def keyProperties = new Properties()
            if (keyPropsFile.exists()) {
                keyProperties.load(new FileInputStream(keyPropsFile))
            }

            def keystorePath = System.getenv("KEYSTORE_PATH") ?: keyProperties['storeFile'] ?: "../keystore/release.keystore"
            def keystoreFile = file(keystorePath)
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: keyProperties['storePassword']
                keyAlias System.getenv("KEY_ALIAS") ?: keyProperties['keyAlias'] ?: "wordlefarsi"
                keyPassword System.getenv("KEY_PASSWORD") ?: keyProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def keystoreFile = file("../keystore/release.keystore")
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'

    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22") {
            because("kotlin-stdlib-jdk7 is now a part of kotlin-stdlib")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22") {
            because("kotlin-stdlib-jdk8 is now a part of kotlin-stdlib")
        }
    }
}
